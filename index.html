<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/teletransit-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TeleTransit: find cargo transport across Tanzania.">
  <meta name="theme-color" content="#141F30">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TeleTransit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TeleTransit</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown while the app loads: the logo, small, on navy, like the app's
       launch screen. Fades out on the app's first frame. */
    html, body { margin: 0; height: 100%; background: #141F30; }
    #loader {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #141F30; z-index: 10;
      transition: opacity .35s ease;
    }
    #loader img { width: 104px; height: 104px; animation: breathe 1.8s ease-in-out infinite; }
    #loader.done { opacity: 0; pointer-events: none; }
    @keyframes breathe { 50% { opacity: .55; transform: scale(.96); } }
    @media (prefers-reduced-motion: reduce) { #loader img { animation: none; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="loader"><img src="splash_logo.png" alt="TeleTransit"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      if (!l) return;
      l.classList.add('done');
      setTimeout(function () { l.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
